name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Zip

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Release $version" }
          $notes += "`n`n**Install:** download the ZIP, extract it, run ``EmojiColumn.exe`` and click *Install / Update*."
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*.zip, dist/*.sha256).FullName --title "Emoji Column ${{ github.ref_name }}" --notes-file notes.md
